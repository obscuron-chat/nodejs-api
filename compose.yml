services:
  api:
    build: .
    container_name: obscuron-api
    # The container reads the same variable names production uses; only
    # the values differ between environments.
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      - mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 8080) + '/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    # Credentials come from the environment, never from this file.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  # Local inspection only. Never expose this in production deployments.
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    profiles: ["tools"]
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${ME_CONFIG_MONGODB_ADMINUSERNAME:?set ME_CONFIG_MONGODB_ADMINUSERNAME in .env}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${ME_CONFIG_MONGODB_ADMINPASSWORD:?set ME_CONFIG_MONGODB_ADMINPASSWORD in .env}
      ME_CONFIG_MONGODB_SERVER: ${ME_CONFIG_MONGODB_SERVER:-mongodb}
    depends_on:
      - mongodb

volumes:
  mongodb_data:
